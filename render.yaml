services:
  - type: web
    name: dokon-hisobi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        value: "6876312568"
      - key: MINI_APP_URL
        sync: false
      - key: ADMIN_SECRET_CODE
        value: DOKON2024
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: WEB_SERVER_HOST
        value: 0.0.0.0

