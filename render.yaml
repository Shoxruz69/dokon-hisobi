services:
  - type: web
    name: dokon-hisobi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: MINI_APP_URL
        value: "https://dokon-hisobi.onrender.com"
      - key: ADMIN_SECRET_CODE
        value: DOKON2024
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: WEB_SERVER_HOST
        value: 0.0.0.0
